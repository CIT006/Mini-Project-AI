[theme]
# Use the light base so native widgets are light for everyone (regardless of the OS theme);
# app.py overrides the colours when the in-app dark mode is switched on.
base = "light"
primaryColor = "#0F766E"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F4F8"
textColor = "#0F172A"

[browser]
gatherUsageStats = false